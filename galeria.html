<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Gallery - Fokkelman Family</title>    <link rel="icon" type="image/svg+xml" href="favicon.svg">    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">🏠 Home</a></li>
            <li><a href="galeria.html" class="active">🖼️ Gallery</a></li>
            <li><a href="recorrido.html">📖 Journey <span id="journeyCount" class="journey-count">0</span></a></li>
            <li><a href="album.html">📚 Album</a></li>
        </ul>
    </nav>

    <div class="container">
        <section id="galeria" class="page-section active">
            <div class="section-header">
                <h2>🖼️ Full Gallery</h2>
                <p>All the family photographs</p>
            </div>

            <div class="gallery-grid" id="galleryGrid">
                <p>Cargando galería...</p>
            </div>
        </section>
    </div>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">✕</button>
        <img src="" alt="" class="lightbox-content" id="lightboxImg">
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Scripts base -->
    <script src="js/config.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/photo-manager.js"></script>
    <script src="js/lightbox.js"></script>
    <script src="js/photo-loader.js"></script>
    
    <!-- Script inline para cargar galería -->
    <script>
        let todasLasFotos = [];
        const FOTOS_POR_PAGINA = 50;
        let paginaActual = 1;
        let totalPaginas = 1;
        
        async function cargarGaleria() {
            const grid = document.getElementById('galleryGrid');
            if (!grid) return;
            
            try {
                const fotos = await loadPhotosFromJSON();
                todasLasFotos = filterDeletedPhotos(fotos);
                totalPaginas = Math.ceil(todasLasFotos.length / FOTOS_POR_PAGINA);
                
                mostrarPagina(1);
                crearControlesPaginacion();
                await actualizarContadorRecorrido();
                
            } catch (error) {
                console.error('ERROR cargando galería:', error);
                grid.innerHTML = '<p style="color: red;">Error cargando galería: ' + error.message + '</p>';
            }
        }
        
        async function mostrarPagina(numeroPagina) {
            paginaActual = numeroPagina;
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';
            
            const inicio = (numeroPagina - 1) * FOTOS_POR_PAGINA;
            const fin = Math.min(inicio + FOTOS_POR_PAGINA, todasLasFotos.length);
            
            for (let i = inicio; i < fin; i++) {
                const photoPath = todasLasFotos[i];
                const photoId = photoPath.split('_')[1];
                
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.dataset.photoPath = photoPath;
                
                const img = document.createElement('img');
                img.src = getCloudinaryUrl(photoPath, 'w_400,h_400,c_fill/');
                img.alt = `Foto ${photoId}`;
                img.loading = 'lazy';
                img.onclick = function() { openLightbox(getCloudinaryUrl(photoPath, 'q_auto,f_auto/')); };
                
                const actions = document.createElement('div');
                actions.className = 'photo-actions';
                
                const enRecorrido = await isInJourney(photoPath);
                
                const btnJourney = document.createElement('button');
                btnJourney.className = 'btn-add-journey';
                btnJourney.textContent = enRecorrido ? '✓ In journey' : '📖 Add to journey';
                btnJourney.disabled = enRecorrido;
                btnJourney.onclick = async function(e) {
                    e.stopPropagation();
                    await addToJourney(photoPath);
                    btnJourney.textContent = '✓ In journey';
                    btnJourney.disabled = true;
                    await actualizarContadorRecorrido();
                };
                
                const btnDelete = document.createElement('button');
                btnDelete.className = 'btn-delete';
                btnDelete.textContent = '🗑️ Delete';
                btnDelete.onclick = function(e) {
                    e.stopPropagation();
                    if (confirm('Delete this photo from the gallery?')) {
                        deletePhoto(photoPath);
                        todasLasFotos = todasLasFotos.filter(p => p !== photoPath);
                        totalPaginas = Math.ceil(todasLasFotos.length / FOTOS_POR_PAGINA);
                        if (todasLasFotos.length > 0 && inicio >= todasLasFotos.length) {
                            mostrarPagina(Math.max(1, paginaActual - 1));
                        } else {
                            mostrarPagina(paginaActual);
                        }
                        crearControlesPaginacion();
                    }
                };
                
                actions.appendChild(btnJourney);
                actions.appendChild(btnDelete);
                item.appendChild(img);
                item.appendChild(actions);
                grid.appendChild(item);
            }
            
            actualizarControlesPaginacion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        function crearControlesPaginacion() {
            let paginationDiv = document.getElementById('pagination');
            if (!paginationDiv) {
                paginationDiv = document.createElement('div');
                paginationDiv.id = 'pagination';
                paginationDiv.style.cssText = 'display: flex; justify-content: center; align-items: center; gap: 0.5rem; margin: 2rem 0; flex-wrap: wrap;';
                document.querySelector('.container').appendChild(paginationDiv);
            }
            actualizarControlesPaginacion();
        }
        
        function actualizarControlesPaginacion() {
            const paginationDiv = document.getElementById('pagination');
            if (!paginationDiv) return;
            
            paginationDiv.innerHTML = '';
            
            // Botón anterior
            const btnPrev = document.createElement('button');
            btnPrev.textContent = '← Previous';
            btnPrev.className = 'btn-nav';
            btnPrev.disabled = paginaActual === 1;
            btnPrev.onclick = () => mostrarPagina(paginaActual - 1);
            paginationDiv.appendChild(btnPrev);
            
            // Info de página
            const pageInfo = document.createElement('span');
            pageInfo.textContent = `Page ${paginaActual} of ${totalPaginas} (${todasLasFotos.length} photos)`;
            pageInfo.style.cssText = 'margin: 0 1rem; color: white; font-weight: 600;';
            paginationDiv.appendChild(pageInfo);
            
            // Botón siguiente
            const btnNext = document.createElement('button');
            btnNext.textContent = 'Next →';
            btnNext.className = 'btn-nav';
            btnNext.disabled = paginaActual === totalPaginas;
            btnNext.onclick = () => mostrarPagina(paginaActual + 1);
            paginationDiv.appendChild(btnNext);
            
            // Salto rápido (solo si hay más de 5 páginas)
            if (totalPaginas > 5) {
                const jumpDiv = document.createElement('div');
                jumpDiv.style.cssText = 'display: flex; gap: 0.5rem; align-items: center; margin-left: 1rem;';
                
                const label = document.createElement('span');
                label.textContent = 'Go to:';
                label.style.cssText = 'color: white;';
                
                const input = document.createElement('input');
                input.type = 'number';
                input.min = 1;
                input.max = totalPaginas;
                input.value = paginaActual;
                input.style.cssText = 'width: 60px; padding: 0.5rem; border-radius: 6px; border: 2px solid white;';
                
                const btnGo = document.createElement('button');
                btnGo.textContent = 'Go';
                btnGo.className = 'btn-nav';
                btnGo.onclick = () => {
                    const pagina = parseInt(input.value);
                    if (pagina >= 1 && pagina <= totalPaginas) {
                        mostrarPagina(pagina);
                    }
                };
                
                jumpDiv.appendChild(label);
                jumpDiv.appendChild(input);
                jumpDiv.appendChild(btnGo);
                paginationDiv.appendChild(jumpDiv);
            }
        }
        
        async function actualizarContadorRecorrido() {
            const contador = document.getElementById('journeyCount');
            if (contador) {
                const count = await getJourneyCount();
                contador.textContent = count;
            }
        }
        
        function iniciar() {
            setTimeout(() => {
                if (isAuthenticated()) {
                    actualizarContadorRecorrido();
                    cargarGaleria();
                } else {
                    setTimeout(iniciar, 500);
                }
            }, 100);
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', iniciar);
        } else {
            iniciar();
        }
    </script>
</body>
</html>
