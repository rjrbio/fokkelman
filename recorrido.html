<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Journey - Fokkelman Family</title>    <link rel="icon" type="image/svg+xml" href="favicon.svg">    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">🏠 Home</a></li>
            <li><a href="galeria.html">🖼️ Gallery</a></li>
            <li><a href="recorrido.html" class="active">📖 Journey <span id="journeyCount" class="journey-count">0</span></a></li>
            <li><a href="album.html">📚 Album</a></li>
        </ul>
    </nav>

    <div class="container">
        <section id="recorrido" class="page-section active">
            <div class="section-header">
                <h2>📖 Memory Journey</h2>
                <p>Explore the photos and add your memories</p>
            </div>

            <div class="photo-journey" id="photoJourney">
                <p>Loading journey...</p>
            </div>
        </section>
    </div>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">✕</button>
        <img src="" alt="" class="lightbox-content" id="lightboxImg">
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Scripts base -->
    <script src="js/config.env.js"></script>
    <script src="js/config.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/photo-manager.js"></script>
    <script src="js/lightbox.js"></script>
    
    <script>
        let indiceActual = 0;
        let fotosRecorrido = [];
        
        async function cargarRecorrido() {
            const container = document.getElementById('photoJourney');
            if (!container) return;

            try {
                const todasLasFotos = await getJourneyPhotos();
                
                // Filtrar solo las fotos que NO tienen información guardada
                fotosRecorrido = [];
                for (const photoPath of todasLasFotos) {
                    const info = await getPhotoInfo(photoPath);
                    if (!info) {
                        fotosRecorrido.push(photoPath);
                    }
                }
                
                container.innerHTML = '';

                if (!fotosRecorrido || fotosRecorrido.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <h3>📚 All memories saved!</h3>
                            <p>All your journey photos have memories saved.</p>
                            <p>Go to the <a href="album.html">Album</a> to view all your saved memories, or add more photos from the <a href="galeria.html">Gallery</a>.</p>
                        </div>
                    `;
                    return;
                }

                mostrarFoto();
                
            } catch (error) {
                console.error('ERROR en cargarRecorrido:', error);
                container.innerHTML = '<p style="color: red;">Error cargando recorrido: ' + error.message + '</p>';
            }
        }
        
        async function mostrarFoto() {
            const container = document.getElementById('photoJourney');
            const photoPath = fotosRecorrido[indiceActual];
            const savedInfo = await getPhotoInfo(photoPath);
            
            container.innerHTML = '';
            
            const photoItem = document.createElement('div');
            photoItem.className = 'journey-photo-item';
            
            // Contenedor de imagen
            const photoContainer = document.createElement('div');
            photoContainer.className = 'journey-photo-container';
            
            const img = document.createElement('img');
            img.className = 'journey-photo-img';
            img.src = getCloudinaryUrl(photoPath, 'q_auto,f_auto/');
            img.alt = `Foto ${indiceActual + 1}`;
            img.onclick = function() {
                openLightbox(getCloudinaryUrl(photoPath, 'q_auto,f_auto/'));
            };
            photoContainer.appendChild(img);
            photoItem.appendChild(photoContainer);
            
            // Información
            const infoDiv = document.createElement('div');
            infoDiv.className = 'journey-info-div';
            
            const titulo = document.createElement('h3');
            titulo.className = 'journey-title';
            titulo.textContent = `Foto ${indiceActual + 1} de ${fotosRecorrido.length}`;
            infoDiv.appendChild(titulo);
            
            if (savedInfo) {
                // Mostrar info guardada
                const desc = document.createElement('div');
                desc.innerHTML = `
                    <div style="margin-bottom: 1rem;">
                        <strong>📝 Description:</strong>
                        <div style="background: #f8fafc; padding: 1rem; border-radius: 8px; margin-top: 0.5rem;">
                            ${savedInfo.description || '<em>No description</em>'}
                        </div>
                    </div>
                    <div style="margin-bottom: 1rem;">
                        <strong>📅 Date:</strong>
                        <div style="background: #f8fafc; padding: 1rem; border-radius: 8px; margin-top: 0.5rem;">
                            ${savedInfo.year || '<em>No date</em>'}
                        </div>
                    </div>
                    <div style="margin-bottom: 1rem;">
                        <strong>📍 Location:</strong>
                        <div style="background: #f8fafc; padding: 1rem; border-radius: 8px; margin-top: 0.5rem;">
                            ${savedInfo.place || '<em>No location</em>'}
                        </div>
                    </div>
                `;
                infoDiv.appendChild(desc);
                
                const btnContainer = document.createElement('div');
                btnContainer.className = 'journey-btn-container';
                
                const btnEdit = document.createElement('button');
                btnEdit.textContent = '✏️ Edit information';
                btnEdit.className = 'btn-save btn-edit-journey';
                btnEdit.onclick = async function() {
                    await deletePhotoInfo(photoPath);
                    mostrarFoto();
                };
                
                const btnRemove = document.createElement('button');
                btnRemove.textContent = '🗑️ Remove from Journey';
                btnRemove.className = 'btn-delete';
                btnRemove.style.cssText = 'flex: 1;';
                btnRemove.onclick = async function() {
                    if (confirm('Remove this photo from the journey?')) {
                        await removeFromJourney(photoPath);
                        fotosRecorrido = fotosRecorrido.filter(p => p !== photoPath);
                        if (fotosRecorrido.length === 0) {
                            await cargarRecorrido();
                        } else {
                            if (indiceActual >= fotosRecorrido.length) {
                                indiceActual = fotosRecorrido.length - 1;
                            }
                            await mostrarFoto();
                        }
                        await actualizarContador();
                    }
                };
                
                btnContainer.appendChild(btnEdit);
                btnContainer.appendChild(btnRemove);
                infoDiv.appendChild(btnContainer);
                
            } else {
                // Formulario para añadir info
                const form = document.createElement('div');
                form.innerHTML = `
                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">📝 What do you remember about this moment?</label>
                        <textarea id="desc" placeholder="Describe this special moment..." 
                                  style="width: 100%; padding: 0.75rem; border: 2px solid #e2e8f0; border-radius: 8px; font-family: inherit; min-height: 100px;"></textarea>
                    </div>
                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">📅 What year was it?</label>
                        <input type="text" id="year" placeholder="E.g.: 1975"
                               style="width: 100%; padding: 0.75rem; border: 2px solid #e2e8f0; border-radius: 8px; font-family: inherit;">
                    </div>
                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">📍 Where were you?</label>
                        <input type="text" id="place" placeholder="E.g.: Grandparents' house, Madrid"
                               style="width: 100%; padding: 0.75rem; border: 2px solid #e2e8f0; border-radius: 8px; font-family: inherit;">
                    </div>
                `;
                infoDiv.appendChild(form);
                
                const btnContainer = document.createElement('div');
                btnContainer.className = 'journey-btn-container';
                
                const btnSave = document.createElement('button');
                btnSave.textContent = '💾 Save Memory';
                btnSave.className = 'btn-save';
                btnSave.onclick = async function() {
                    const description = document.getElementById('desc').value;
                    const year = document.getElementById('year').value;
                    const place = document.getElementById('place').value;
                    
                    if (!description && !year && !place) {
                        alert('Please, complete at least one field');
                        return;
                    }
                    
                    await savePhotoInfo(photoPath, { description, year, place });
                    alert('Memory saved! ✨ This photo is now in your Album.');
                    
                    // Remover de la lista local de Journey (ya no debe mostrarse aquí)
                    fotosRecorrido = fotosRecorrido.filter(p => p !== photoPath);
                    
                    if (fotosRecorrido.length === 0) {
                        // Si no quedan fotos, recargar para mostrar mensaje vacío
                        await cargarRecorrido();
                    } else {
                        // Ajustar índice si es necesario
                        if (indiceActual >= fotosRecorrido.length) {
                            indiceActual = fotosRecorrido.length - 1;
                        }
                        await mostrarFoto();
                    }
                    
                    await actualizarContador();
                };
                
                const btnRemove = document.createElement('button');
                btnRemove.textContent = '🗑️ Remove from Journey';
                btnRemove.className = 'btn-delete';
                btnRemove.onclick = async function() {
                    if (confirm('Remove this photo from the journey?')) {
                        await removeFromJourney(photoPath);
                        fotosRecorrido = fotosRecorrido.filter(p => p !== photoPath);
                        if (fotosRecorrido.length === 0) {
                            await cargarRecorrido();
                        } else {
                            if (indiceActual >= fotosRecorrido.length) {
                                indiceActual = fotosRecorrido.length - 1;
                            }
                            await mostrarFoto();
                        }
                        await actualizarContador();
                    }
                };
                
                btnContainer.appendChild(btnSave);
                btnContainer.appendChild(btnRemove);
                infoDiv.appendChild(btnContainer);
            }
            
            photoItem.appendChild(infoDiv);
            
            // Botones de navegación
            const navDiv = document.createElement('div');
            navDiv.className = 'journey-nav-buttons';
            
            const btnPrev = document.createElement('button');
            btnPrev.textContent = '← Previous';
            btnPrev.className = 'btn-nav';
            btnPrev.disabled = indiceActual === 0;
            btnPrev.onclick = function() {
                if (indiceActual > 0) {
                    indiceActual--;
                    mostrarFoto();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };
            
            const btnNext = document.createElement('button');
            btnNext.textContent = 'Next →';
            btnNext.className = 'btn-nav';
            btnNext.disabled = indiceActual === fotosRecorrido.length - 1;
            btnNext.onclick = function() {
                if (indiceActual < fotosRecorrido.length - 1) {
                    indiceActual++;
                    mostrarFoto();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };
            
            navDiv.appendChild(btnPrev);
            navDiv.appendChild(btnNext);
            photoItem.appendChild(navDiv);
            
            container.appendChild(photoItem);
        }
        
        async function actualizarContador() {
            const contador = document.getElementById('journeyCount');
            if (contador) {
                const count = await getJourneyCount();
                contador.textContent = count;
            }
        }
        
        function iniciar() {
            setTimeout(() => {
                if (isAuthenticated()) {
                    actualizarContador();
                    cargarRecorrido();
                } else {
                    setTimeout(iniciar, 500);
                }
            }, 100);
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', iniciar);
        } else {
            iniciar();
        }
    </script>
</body>
</html>
