<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Album - Fokkelman Family</title>    <link rel="icon" type="image/svg+xml" href="favicon.svg">    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">🏠 Home</a></li>
            <li><a href="galeria.html">🖼️ Gallery</a></li>
            <li><a href="recorrido.html">📖 Journey <span id="journeyCount" class="journey-count">0</span></a></li>
            <li><a href="album.html" class="active">📚 Album</a></li>
        </ul>
    </nav>

    <div class="container">
        <section id="album" class="page-section active">
            <div class="section-header">
                <h2>📚 Memory Album</h2>
                <p>All your saved memories in one place</p>
            </div>

            <div id="albumGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(450px, 1fr)); gap: 2rem; margin-top: 2rem;">
                <p>Cargando álbum...</p>
            </div>
        </section>
    </div>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">✕</button>
        <img src="" alt="" class="lightbox-content" id="lightboxImg">
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Scripts base -->
    <script src="js/config.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/photo-manager.js"></script>
    <script src="js/lightbox.js"></script>
    
    <script>
        async function cargarAlbum() {
            const grid = document.getElementById('albumGrid');
            if (!grid) return;

            try {
                const fotosRecorrido = await getJourneyPhotos();
                grid.innerHTML = '';

                if (!fotosRecorrido || fotosRecorrido.length === 0) {
                    grid.innerHTML = `
                        <div style="background: white; padding: 3rem; border-radius: 16px; text-align: center; grid-column: 1 / -1;">
                            <h3 style="color: var(--primary); margin-bottom: 1rem;">📚 Empty Album</h3>
                            <p style="font-size: 1.1rem; color: #64748b; margin-bottom: 1.5rem;">
                                You haven't added photos with memories yet.
                            </p>
                            <p style="font-size: 1rem; color: #94a3b8;">
                                Go to <a href="recorrido.html" style="color: var(--primary); font-weight: bold;">Journey</a> 
                                and save the memories of your favorite photos.
                            </p>
                        </div>
                    `;
                    return;
                }

                // Cargar todas las fotos con sus recuerdos
                for (let i = 0; i < fotosRecorrido.length; i++) {
                    const photoPath = fotosRecorrido[i];
                    const savedInfo = await getPhotoInfo(photoPath);

                    const card = document.createElement('div');
                    card.style.cssText = 'background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.3s;';
                    card.onmouseenter = function() { this.style.transform = 'translateY(-5px)'; };
                    card.onmouseleave = function() { this.style.transform = 'translateY(0)'; };

                    // Imagen
                    const imgContainer = document.createElement('div');
                    imgContainer.style.cssText = 'height: 400px; overflow: hidden; cursor: pointer;';
                    
                    const img = document.createElement('img');
                    img.src = getCloudinaryUrl(photoPath, 'w_600,h_600,c_fill/');
                    img.alt = `Foto ${i + 1}`;
                    img.style.cssText = 'width: 100%; height: 100%; object-fit: cover;';
                    img.onclick = function() {
                        openLightbox(getCloudinaryUrl(photoPath, 'q_auto,f_auto/'));
                    };
                    imgContainer.appendChild(img);
                    card.appendChild(imgContainer);

                    // Información
                    const infoContainer = document.createElement('div');
                    infoContainer.style.cssText = 'padding: 1.5rem;';

                    const numero = document.createElement('div');
                    numero.textContent = `Foto ${i + 1}`;
                    numero.style.cssText = 'color: var(--primary); font-weight: bold; margin-bottom: 1rem; font-size: 1.1rem;';
                    infoContainer.appendChild(numero);

                    if (savedInfo && (savedInfo.description || savedInfo.year || savedInfo.place)) {
                        if (savedInfo.description) {
                            const desc = document.createElement('div');
                            desc.innerHTML = `
                                <strong style="color: #64748b;">📝 Description:</strong>
                                <p style="margin: 0.5rem 0 1rem; color: #334155; line-height: 1.6;">${savedInfo.description}</p>
                            `;
                            infoContainer.appendChild(desc);
                        }

                        if (savedInfo.year) {
                            const year = document.createElement('div');
                            year.innerHTML = `
                                <strong style="color: #64748b;">📅 Date:</strong>
                                <p style="margin: 0.5rem 0 1rem; color: #334155;">${savedInfo.year}</p>
                            `;
                            infoContainer.appendChild(year);
                        }

                        if (savedInfo.place) {
                            const place = document.createElement('div');
                            place.innerHTML = `
                                <strong style="color: #64748b;">📍 Location:</strong>
                                <p style="margin: 0.5rem 0 1rem; color: #334155;">${savedInfo.place}</p>
                            `;
                            infoContainer.appendChild(place);
                        }
                    } else {
                        const sinInfo = document.createElement('p');
                        sinInfo.textContent = 'No saved memories yet';
                        sinInfo.style.cssText = 'color: #94a3b8; font-style: italic;';
                        infoContainer.appendChild(sinInfo);
                    }

                    card.appendChild(infoContainer);
                    grid.appendChild(card);
                }

            } catch (error) {
                console.error('ERROR cargando álbum:', error);
                grid.innerHTML = '<p style="color: red;">Error cargando álbum: ' + error.message + '</p>';
            }
        }

        async function actualizarContador() {
            const contador = document.getElementById('journeyCount');
            if (contador) {
                const count = await getJourneyCount();
                contador.textContent = count;
            }
        }

        function iniciar() {
            setTimeout(() => {
                if (isAuthenticated()) {
                    actualizarContador();
                    cargarAlbum();
                } else {
                    setTimeout(iniciar, 500);
                }
            }, 100);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', iniciar);
        } else {
            iniciar();
        }
    </script>
</body>
</html>
