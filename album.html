<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Album - Fokkelman Family</title>    <link rel="icon" type="image/svg+xml" href="favicon.svg">    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">🏠 Home</a></li>
            <li><a href="galeria.html">🖼️ Gallery</a></li>
            <li><a href="recorrido.html">📖 Journey <span id="journeyCount" class="journey-count">0</span></a></li>
            <li><a href="album.html" class="active">📚 Album</a></li>
        </ul>
    </nav>

    <div class="container">
        <section id="album" class="page-section active">
            <div class="section-header">
                <h2>📚 Memory Album</h2>
                <p>All your saved memories in one place</p>
            </div>

            <!-- Botón para añadir nueva foto -->
            <div style="text-align: center; margin-bottom: 2rem;">
                <button id="btnAddNewPhoto" class="btn-add-new-photo" onclick="abrirModalNuevaFoto()">
                    📷 Add New Photo
                </button>
            </div>

            <div id="albumGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(450px, 1fr)); gap: 2rem; margin-top: 2rem;">
                <p>Loading album...</p>
            </div>
        </section>
    </div>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">✕</button>
        <img src="" alt="" class="lightbox-content" id="lightboxImg">
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Scripts base -->
    <script src="js/config.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/photo-manager.js"></script>
    <script src="js/lightbox.js"></script>
    
    <script>
        async function cargarAlbum() {
            const grid = document.getElementById('albumGrid');
            if (!grid) return;

            try {
                const fotosRecorrido = await getJourneyPhotos();
                grid.innerHTML = '';

                if (!fotosRecorrido || fotosRecorrido.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state" style="grid-column: 1 / -1;">
                            <h3>📚 Empty Album</h3>
                            <p>You haven't added photos with memories yet.</p>
                            <p>Go to <a href="recorrido.html">Journey</a> and save the memories of your favorite photos.</p>
                        </div>
                    `;
                    return;
                }

                // Cargar todas las fotos con sus recuerdos
                for (let i = 0; i < fotosRecorrido.length; i++) {
                    const photoId = fotosRecorrido[i];
                    const savedInfo = await getPhotoInfo(photoId);
                    
                    // Convertir el ID de Firebase de vuelta al path de Cloudinary
                    const photoPath = photoId.replace(/__/g, '/');
                    
                    // Todas las fotos ahora usan Cloudinary
                    const imageUrl = getCloudinaryUrl(photoPath, 'w_600,h_600,c_fill/');

                    const card = document.createElement('div');
                    card.className = 'album-card';

                    // Imagen
                    const imgContainer = document.createElement('div');
                    imgContainer.className = 'album-img-container';
                    
                    const img = document.createElement('img');
                    img.className = 'album-img';
                    img.src = imageUrl;
                    img.alt = `Photo ${i + 1}`;
                    img.onclick = function() {
                        openLightbox(getCloudinaryUrl(photoPath, 'q_auto,f_auto/'));
                    };
                    imgContainer.appendChild(img);
                    card.appendChild(imgContainer);

                    // Información
                    const infoContainer = document.createElement('div');
                    infoContainer.className = 'album-info';

                    const numero = document.createElement('div');
                    numero.className = 'album-photo-number';
                    numero.textContent = `Photo ${i + 1}`;
                    infoContainer.appendChild(numero);

                    if (savedInfo && (savedInfo.description || savedInfo.year || savedInfo.place)) {
                        if (savedInfo.description) {
                            const desc = document.createElement('div');
                            desc.innerHTML = `
                                <strong style="color: var(--warm-brown);">📝 Description:</strong>
                                <p style="margin: 0.5rem 0 1rem; color: var(--charcoal); line-height: 1.6;">${savedInfo.description}</p>
                            `;
                            infoContainer.appendChild(desc);
                        }

                        if (savedInfo.year) {
                            const year = document.createElement('div');
                            year.innerHTML = `
                                <strong style="color: var(--warm-brown);">📅 Date:</strong>
                                <p style="margin: 0.5rem 0 1rem; color: var(--charcoal);">${savedInfo.year}</p>
                            `;
                            infoContainer.appendChild(year);
                        }

                        if (savedInfo.place) {
                            const place = document.createElement('div');
                            place.innerHTML = `
                                <strong style="color: var(--warm-brown);">📍 Location:</strong>
                                <p style="margin: 0.5rem 0 1rem; color: var(--charcoal);">${savedInfo.place}</p>
                            `;
                            infoContainer.appendChild(place);
                        }
                    } else {
                        const sinInfo = document.createElement('p');
                        sinInfo.className = 'album-no-info';
                        sinInfo.textContent = 'No saved memories yet';
                        infoContainer.appendChild(sinInfo);
                    }

                    // Contenedor de botones
                    const btnContainer = document.createElement('div');
                    btnContainer.className = 'album-btn-container';

                    // Botón de editar
                    const btnEdit = document.createElement('button');
                    btnEdit.className = 'btn-edit-album';
                    btnEdit.textContent = '✏️ Edit';
                    btnEdit.onclick = async function() {
                        // Crear formulario de edición
                        const form = document.createElement('div');
                        form.className = 'edit-modal';
                        
                        const formContent = document.createElement('div');
                        formContent.className = 'edit-modal-content';
                        
                        formContent.innerHTML = `
                            <h3>Edit Memory</h3>
                            <div class="input-group">
                                <label>📝 Description:</label>
                                <textarea id="editDesc">${savedInfo?.description || ''}</textarea>
                            </div>
                            <div class="input-group">
                                <label>📅 Date:</label>
                                <input type="text" id="editYear" value="${savedInfo?.year || ''}">
                            </div>
                            <div class="input-group">
                                <label>📍 Location:</label>
                                <input type="text" id="editPlace" value="${savedInfo?.place || ''}">
                            </div>
                            <div class="edit-modal-buttons">
                                <button id="btnSaveEdit" class="btn-save-edit">💾 Save</button>
                                <button id="btnCancelEdit" class="btn-cancel-edit">✖️ Cancel</button>
                            </div>
                        `;
                        
                        form.appendChild(formContent);
                        document.body.appendChild(form);
                        
                        document.getElementById('btnSaveEdit').onclick = async function() {
                            const desc = document.getElementById('editDesc').value.trim();
                            const year = document.getElementById('editYear').value.trim();
                            const place = document.getElementById('editPlace').value.trim();
                            
                            await savePhotoInfo(photoId, { description: desc, year: year, place: place });
                            document.body.removeChild(form);
                            await cargarAlbum();
                        };
                        
                        document.getElementById('btnCancelEdit').onclick = function() {
                            document.body.removeChild(form);
                        };
                        
                        form.onclick = function(e) {
                            if (e.target === form) {
                                document.body.removeChild(form);
                            }
                        };
                    };
                    btnContainer.appendChild(btnEdit);

                    // Botón de eliminar
                    const btnDelete = document.createElement('button');
                    btnDelete.className = 'btn-delete-album';
                    btnDelete.textContent = '🗑️ Remove';
                    btnDelete.onclick = async function() {
                        if (confirm('Remove this photo from the album? This will delete its saved memory and remove it from your journey. (The original photo will remain in Cloudinary)')) {
                            // Eliminar metadata y del journey
                            await deletePhotoInfo(photoId);
                            await removeFromJourney(photoId);
                            await cargarAlbum();
                            await actualizarContador();
                        }
                    };
                    btnContainer.appendChild(btnDelete);

                    infoContainer.appendChild(btnContainer);

                    card.appendChild(infoContainer);
                    grid.appendChild(card);
                }

            } catch (error) {
                console.error('ERROR cargando álbum:', error);
                grid.innerHTML = '<p style="color: red;">Error cargando álbum: ' + error.message + '</p>';
            }
        }

        async function actualizarContador() {
            const contador = document.getElementById('journeyCount');
            if (contador) {
                const count = await getJourneyCount();
                contador.textContent = count;
            }
        }

        // Función para abrir modal de nueva foto
        function abrirModalNuevaFoto() {
            const modal = document.createElement('div');
            modal.className = 'edit-modal';
            
            const modalContent = document.createElement('div');
            modalContent.className = 'edit-modal-content';
            
            modalContent.innerHTML = `
                <h3>📷 Add New Photo</h3>
                <div class="input-group">
                    <label>Select photo from your device:</label>
                    <input type="file" id="newPhotoFile" accept="image/*" style="width: 100%; padding: 0.75rem; border: 2px solid var(--warm-brown); border-radius: 6px; font-family: Georgia, serif;">
                    <div id="imagePreview" style="margin-top: 1rem; max-height: 300px; overflow: hidden; border-radius: 8px; display: none;">
                        <img id="previewImg" style="width: 100%; object-fit: contain;" />
                    </div>
                </div>
                <div class="input-group">
                    <label>📝 Description:</label>
                    <textarea id="newDesc" placeholder="Describe this memory..."></textarea>
                </div>
                <div class="input-group">
                    <label>📅 Date:</label>
                    <input type="text" id="newYear" placeholder="E.g.: 2024">
                </div>
                <div class="input-group">
                    <label>📍 Location:</label>
                    <input type="text" id="newPlace" placeholder="E.g.: Home, Amsterdam">
                </div>
                <div class="edit-modal-buttons">
                    <button id="btnSaveNewPhoto" class="btn-save-edit">💾 Add to Album</button>
                    <button id="btnCancelNewPhoto" class="btn-cancel-edit">✖️ Cancel</button>
                </div>
            `;
            
            modal.appendChild(modalContent);
            document.body.appendChild(modal);
            
            // Preview de imagen
            document.getElementById('newPhotoFile').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        document.getElementById('previewImg').src = event.target.result;
                        document.getElementById('imagePreview').style.display = 'block';
                    };
                    reader.readAsDataURL(file);
                }
            });
            
            // Guardar nueva foto
            document.getElementById('btnSaveNewPhoto').onclick = async function() {
                const fileInput = document.getElementById('newPhotoFile');
                const desc = document.getElementById('newDesc').value.trim();
                const year = document.getElementById('newYear').value.trim();
                const place = document.getElementById('newPlace').value.trim();
                
                if (!fileInput.files[0]) {
                    alert('Please select a photo');
                    return;
                }
                
                try {
                    const file = fileInput.files[0];
                    
                    // Subir a Cloudinary
                    const cloudinaryData = await subirACloudinary(file);
                    
                    // Usar el public_id directamente de la respuesta de Cloudinary
                    const publicId = cloudinaryData.public_id;
                    
                    // Construir el path completo con extensión
                    const photoPath = publicId + '.' + cloudinaryData.format;
                    
                    // Convertir el path para Firebase (reemplazar / con __)
                    const firebaseId = photoPath.replace(/\//g, '__');
                    
                    // Añadir al journey y guardar metadata
                    await addToJourney(firebaseId);
                    await savePhotoInfo(firebaseId, { description: desc, year: year, place: place });
                    
                    document.body.removeChild(modal);
                    await cargarAlbum();
                    await actualizarContador();
                    alert('Photo added to album! ✨');
                } catch (error) {
                    alert('Error adding photo: ' + error.message);
                }
            };
            
            document.getElementById('btnCancelNewPhoto').onclick = function() {
                document.body.removeChild(modal);
            };
            
            modal.onclick = function(e) {
                if (e.target === modal) {
                    document.body.removeChild(modal);
                }
            };
        }
        
        // Función para subir imagen a Cloudinary
        async function subirACloudinary(file) {
            const uploadPreset = 'fokkelman_unsigned';
            
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', uploadPreset);
            formData.append('folder', 'family_custom'); // Carpeta en Cloudinary
            formData.append('public_id', 'custom_fokkelman_' + Date.now()); // ID único
            
            const response = await fetch(
                `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
                {
                    method: 'POST',
                    body: formData
                }
            );
            
            if (!response.ok) {
                const error = await response.json();
                throw new Error('Cloudinary upload failed: ' + (error.error?.message || 'Unknown error'));
            }
            
            const data = await response.json();
            // Devolver el objeto completo con public_id y formato
            return {
                secure_url: data.secure_url,
                public_id: data.public_id,
                format: data.format
            };
        }
        
        function iniciar() {
            setTimeout(() => {
                if (isAuthenticated()) {
                    actualizarContador();
                    cargarAlbum();
                } else {
                    setTimeout(iniciar, 500);
                }
            }, 100);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', iniciar);
        } else {
            iniciar();
        }
    </script>
</body>
</html>
