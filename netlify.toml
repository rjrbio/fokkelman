# Configuración de Netlify para Galería Familiar

# Configuración de build (no necesaria para sitio estático)
[build]
  publish = "."
  command = "echo 'Static site, no build needed'"

# Headers para cache óptimo
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fotos.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/json"

# Optimizaciones (desactivadas para evitar problemas con módulos)
[build.processing]
  skip_processing = true
